roke-width="2.5" fill="none" stroke-linecap="round"/><polygon points="680,178 670,173 670,183" fill="#d6ccc0"/><rect x="680" y="130" width="122" height="96" rx="12" fill="#b45309"/><text x="741.0" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">执笔师</text><text x="741.0" y="202" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.88">写正文</text><path d="M 802 178 C 814.0 178, 814.0 178, 820 178" stroke="#d6ccc0" stroke-width="2.5" fill="none" stroke-linecap="round"/><polygon points="826,178 816,173 816,183" fill="#d6ccc0"/><rect x="826" y="130" width="122" height="96" rx="12" fill="#b45309"/><text x="887.0" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">审校师</text><text x="887.0" y="202" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.88">查硬伤</text><path d="M 948 178 C 960.0 178, 960.0 178, 966 178" stroke="#d6ccc0" stroke-width="2.5" fill="none" stroke-linecap="round"/><polygon points="972,178 962,173 962,183" fill="#d6ccc0"/><rect x="972" y="130" width="122" height="96" rx="12" fill="#b45309"/><text x="1033.0" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">修订师</text><text x="1033.0" y="202" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.88">改文字</text><path d="M 1094 178 C 1106.0 178, 1106.0 178, 1112 178" stroke="#d6ccc0" stroke-width="2.5" fill="none" stroke-linecap="round"/><polygon points="1118,178 1108,173 1108,183" fill="#d6ccc0"/><rect x="1118" y="130" width="122" height="96" rx="12" fill="#b45309"/><text x="1179.0" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">结算师</text><text x="1179.0" y="202" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.88">记真相</text><path d="M 340 183 C 364.0 183, 364.0 178, 382 178" stroke="#d6ccc0" stroke-width="2.5" fill="none" stroke-linecap="round"/><polygon points="388,178 378,173 378,183" fill="#d6ccc0"/><rect x="1300" y="108" width="280" height="150" rx="14" fill="#ffffff" stroke="#e7e0d5" stroke-width="1.5"/><text x="1440.0" y="142" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#292524">一本书 = 作品专家团</text><text x="1440.0" y="168" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#78716c">整支团队 / 单个成员</text><text x="1440.0" y="192" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#78716c">随时召唤进创作会话</text><text x="1440.0" y="216" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#78716c">读取完整档案与资产</text><path d="M 1246 178 C 1273.0 178, 1273.0 178, 1294 178" stroke="#d6ccc0" stroke-width="2.5" fill="none" stroke-linecap="round"/><polygon points="1300,178 1290,173 1290,183" fill="#d6ccc0"/><rect x="60" y="288" width="1480" height="70" rx="12" fill="#ffffff" stroke="#e7e0d5" stroke-width="1.5"/><text x="92" y="318" font-size="15.5" font-weight="700" fill="#b45309">设定即智能体</text><text x="92" y="344" font-size="14.5" fill="#78716c">人物 · 地点 · 势力 · 器物 · 世界规则 —— 每个设定都是带档案、可召唤的智能体，跨章节复用有据可查</text><rect x="60" y="388" width="1480" height="150" rx="16" fill="#ffffff" stroke="#e7e0d5" stroke-width="1.5"/><text x="92" y="426" font-size="16" font-weight="700" fill="#b45309">拆书八师逆流程</text><text x="92" y="462" font-size="14.5" fill="#78716c">入库师 → 测绘师 → 开卷师 → 本体师 → 纪事师 → 脉络师 → 设定师 → 验收师</text><text x="92" y="498" font-size="14" fill="#78716c">演进中：设定智能体升级为可执行任务的子智能体，由主创作流程指派执行任务、汇报结果，实现更深度的多智能体编排</text></svg>