name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    env:
      SKOOB_DESKTOP_TARGET: ${{ matrix.target }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify signed macOS backend
        if: runner.os == 'macOS'
        run: node scripts/test-desktop-bundle.mjs src-tauri/target/${{ matrix.target }}/release/bundle/macos/Open-Skoob.app
      - uses: actions/upload-artifact@v4
        with:
          name: Open-Skoob-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
